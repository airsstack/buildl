[workspace]
resolver = "3"
members  = [
    "crates/buildl-core",
    "crates/buildl-lua",
    "crates/buildl",
    "crates/buildl-cli",
]
# The REAPI code generator is a package of its own: its build tools (protox,
# prost-build) must not enter the workspace's dependency graph or `cargo deny` run.
exclude  = ["tools/reapi-codegen"]

[workspace.package]
edition      = "2024"
rust-version = "1.94"
license      = "Apache-2.0"
repository   = "https://github.com/airsstack/buildl"
authors      = ["rstlix0x0 <rstlix.dev@gmail.com>"]

[workspace.dependencies]
# The embedded Lua runtime buildl declares its build files on. A dependency of the
# `buildl-lua` crate ONLY — no other crate may know Lua exists, so an airsl
# upgrade's blast radius stays one crate deep. The floor is the 0.1.x release the
# adapter is tested against, and the requirement accepts any newer 0.1.x; airsl 0.1
# requires rustc 1.94, which sets this workspace's rust-version. Pulls in mlua/lua54
# vendored transitively, so a C compiler is required to build this workspace.
airsl      = "0.1.4"
# Serialization for every phase handoff (Vec<Declaration> → TargetGraph → Plan →
# Vec<ActionOutcome>) and the durable stores. NOTE: all JSON output must leave
# through the one canonical sorted-key serializer
# (book/src/ch11-05-determinism-rules.md rule 2), built on serde_json — never
# through serde_json::to_string directly.
serde      = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# Errors. One structured enum in `buildl-core`, airsl-style — structured fields,
# no message parsing anywhere (book/src/ch11-04-errors.md).
thiserror  = "2.0.18"
# SHA-256 for the Digest type — files, outputs, action keys, log blobs. SHA-256
# over blake3 for REAPI compatibility (decision record, book/src/ch11-06-decision-records.md); the
# stat cache makes hashing rare on warm builds anyway. A dependency of
# `buildl-core` only: an adapter that hashes a file streams it through the core's
# `Hasher`, so every digest in the workspace comes from one implementation.
sha2       = "0.10"
# Parallel file hashing in the Plan phase. Confined to the `Digester` adapter in
# `buildl` (book/src/ch11-06-decision-records.md) so the executor's plain-threads
# model stays singular.
rayon      = "1.12.0"
# buildl.toml (the ceiling) parsing in the `Manifest` adapter. Read-only, like
# airsl's extension manifests: the `display` (serialization) default feature is dropped.
# Held on 0.8 because airsl depends on 0.8: a second `toml` tree would fail
# cargo-deny's duplicate-version check.
toml       = { version = "0.8.23", default-features = false, features = ["parse"] }
# The places in `buildl.toml` that `toml` cannot report: where a table is first written, even when
# only a dotted key or a sub-table header implies it. Read-only, with `parse` alone. Held on the
# 0.22 that `toml` 0.8 already pulls in, so the tree gains no second copy.
toml_edit  = { version = "0.22.27", default-features = false, features = ["parse"] }
# Source globbing for `b.sources()` — the declaration phase's only filesystem
# read; results are sorted host-side so declaration is deterministic regardless
# of filesystem order (book/src/appendix-03-lua-api.md).
globset    = "0.4"
walkdir    = "2.5"
# Temp-file-then-rename writes in `buildl`'s shared `state` module, which every
# storage adapter writes a whole file through (book/src/ch11-02-crash-safety.md,
# book/src/ch11-03-four-crates.md), and the temp workspaces of tests. The floor
# is the release whose source was read for what those writes rely on:
# `Builder::permissions` hands the mode to `open(2)`, and `persist` is a rename.
tempfile   = "3.27.0"
# The argument surface of the `buildl` binary: a dependency of `buildl-cli` only.
# Default features are off and six are named: `std`; `derive` for the definitions;
# `help` and `usage` for `--help` and the usage line of an error; `error-context`
# for the argument and the value an error names; `suggestions` for "a similar
# argument exists". `color` is left out on purpose: it would bring in `anstream`
# and its tree, and whether anything is coloured is decided in one place, by the
# binary, from `--color`, `NO_COLOR` and the terminal.
clap       = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
# The gRPC client of the remote cache, in `buildl` only. Default features are off: `channel`
# for the client transport, `codegen` for what the generated services use, `tls-ring` and
# `tls-native-roots` for `grpcs://` with the system roots. The default `transport` feature
# would add the server half to every build; the in-test server asks for it through
# `buildl`'s `test-server` feature instead.
tonic      = { version = "0.14.6", default-features = false, features = ["channel", "codegen", "tls-ring", "tls-native-roots"] }
# The protobuf codec the generated tonic services call, and the messages' derive and
# encoding. Their tag-order encoding is what keeps the digests of a remote action stable.
tonic-prost = "0.14.6"
prost       = "0.14.4"
# `Any`, which the vendored googleapis messages (`google.rpc.Status`, operations) carry.
prost-types = "0.14.4"
# The runtime tonic's client needs, created and owned by the remote adapter in `buildl`;
# worker threads reach it through `block_on`, and no other module sees it. `time` bounds each
# call, each message a `ByteStream` read waits for, and a `ByteStream` write that stops taking
# chunks, by the cache's timeout.
tokio       = { version = "1.54.1", default-features = false, features = ["rt", "rt-multi-thread", "time"] }
# Version 4 UUIDs naming a ByteStream upload's resource (`uploads/<uuid>/blobs/...`).
uuid        = { version = "1.29.0", default-features = false, features = ["v4"] }
# The file events of `buildl watch`: the operating system's own notification of a change
# under the workspace root. Named by the `watch` adapter module of `buildl` only. Default
# features are kept: FSEvents on macOS, inotify on Linux.
notify      = "8.2.1"
# Internal workspace members, in dependency order — path for local builds, version
# for publish-readiness. Members inherit these with `{ workspace = true }`. Cargo
# strips the path and keeps the version when packaging, so a published crate
# depends on crates.io.
buildl-core = { version = "0.1.0", path = "crates/buildl-core" }
buildl-lua  = { version = "0.1.0", path = "crates/buildl-lua" }
buildl      = { version = "0.1.0", path = "crates/buildl" }

[workspace.lints.rust]
unsafe_code        = "forbid"
missing_docs       = "warn"
unreachable_pub    = "warn"
unused_must_use    = "deny"

[workspace.lints.clippy]
pedantic           = { level = "warn", priority = -1 }
nursery            = { level = "warn", priority = -1 }
unwrap_used        = "deny"
expect_used        = "warn"
panic              = "deny"
todo               = "warn"
dbg_macro          = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# A nursery lint that contradicts rustc's `unreachable_pub` above: an item in a
# private module must be `pub(crate)` for one and `pub` for the other. The rustc
# lint wins, so crate-internal items are written `pub(crate)`.
redundant_pub_crate = "allow"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
