# The remote example's server: NativeLink with a local worker that has python3.
# `docker compose up -d --build` starts it, listening on 127.0.0.1 only: the server asks for no
# login and runs what it is sent. `docker compose down` removes it and its cache.
services:
  nativelink:
    build: docker
    ports:
      - "127.0.0.1:50051:50051"
    volumes:
      - ./docker/nativelink.json5:/config:ro
    command: ["/config"]
