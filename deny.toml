#
# cargo-deny policy for the buildl workspace.
#
#   cargo make deny        # all four checks
#   cargo deny check bans  # one of them
#
# Four independent checks: security advisories, license acceptability, dependency
# bans/duplicates, and source registries. CI runs all four.
#
# Install: cargo install --locked cargo-deny
#

[graph]
# Deliberately no `targets` list. Restricting it would silence findings on
# platforms this workspace has not ruled out, and the whole-graph view costs
# nothing while every license present resolves to something permissive.
all-features = true

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Security advisories — RustSec
# ---------------------------------------------------------------------------

[advisories]
# Everything the database reports is a failure. Suppressions are per-advisory
# and belong here with a note saying why the exposure does not apply, never as
# a blanket severity threshold.
ignore = []

# ---------------------------------------------------------------------------
# Licenses
# ---------------------------------------------------------------------------

[licenses]
# Permissive licenses only, seeded from airsl's graph — the set buildl's
# dependency catalog resolves into. Anything arriving outside this set fails the
# check, which is the point: a copyleft dependency should be a decision, not a
# silent transitive addition.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "Unicode-3.0",
    # The TLS stack of the remote cache's gRPC client: `ring` (with Apache-2.0), `rustls-webpki`
    # and `untrusted` are ISC; `subtle` and `matchit` (with MIT) are BSD-3-Clause.
    "BSD-3-Clause",
    "ISC",
]
confidence-threshold = 0.8
exceptions = [
    # `notify` alone carries CC0-1.0, a public-domain dedication. It stays off the general
    # `allow` list so no other crate arrives under it.
    { crate = "notify", allow = ["CC0-1.0"] },
]
# An allowance no crate in the graph uses fails the check, so the allow list
# never grows past what the dependency graph actually needs.
unused-allowed-license = "deny"

[licenses.private]
# Every workspace member is intended for publication to crates.io under Apache-2.0,
# so its license text is a distribution question and is checked like any other crate.
ignore = false

# ---------------------------------------------------------------------------
# Bans and duplicate versions
# ---------------------------------------------------------------------------

[bans]
# Duplicates are denied rather than warned so a second copy of a crate has to
# be acknowledged here. Every duplicate fails until it is added to the `skip` list
# below with a reason.
multiple-versions = "deny"
# No `version = "*"` dependencies. The root manifest gives every direct one an
# explicit version requirement.
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    { crate = "airsl", wrappers = ["buildl-lua"], reason = """\
        ABB §7 rule 1 and §1.2: buildl-core must never depend on airsl, so buildl-lua alone \
        names it and an airsl upgrade's blast radius stays one crate deep""" },
    { crate = "buildl-core", wrappers = ["buildl-lua", "buildl"], reason = """\
        ABB §7 rule 4: the binary reaches core types through buildl's re-exports, so \
        buildl-cli keeps exactly one library dependency""" },
    { crate = "buildl-lua", wrappers = ["buildl"], reason = """\
        ABB §7 rules 1 and 4: buildl-core depends on no buildl crate, and buildl-cli reaches \
        core types only through buildl's re-exports, so buildl alone may name the adapter \
        directly""" },
    { crate = "buildl", wrappers = ["buildl-cli"], reason = """\
        ABB §7 rule 2: buildl-lua never imports buildl, so only buildl-cli may depend on it \
        directly""" },
    { crate = "mlua", wrappers = ["airsl"], reason = """\
        the Lua runtime is airsl's implementation detail; no buildl crate names it directly""" },
    { crate = "toml", wrappers = ["airsl", "buildl"], reason = """\
        ABB §1.2: buildl-core must never depend on toml; §6 places buildl.toml parsing in the \
        Manifest adapter inside buildl""" },
    { crate = "walkdir", wrappers = ["airsl", "buildl-lua", "notify"], reason = """\
        ABB §1.2: buildl-core does no filesystem traversal; buildl-lua walks the declaring \
        directory for b.sources(); notify walks a directory to watch it, inside the watch \
        adapter of buildl""" },
    { crate = "tempfile", wrappers = ["airsl", "buildl-lua", "buildl", "buildl-cli"], reason = """\
        ABB §1.2: temp-file-then-rename is a storage concern of buildl's shared state module; \
        buildl-lua, buildl and buildl-cli also use it for the temp workspaces of their tests""" },
    { crate = "globset", wrappers = ["airsl", "buildl-lua"], reason = """\
        ABB §1.2: b.sources() globbing is a filesystem read, not core logic; buildl-lua \
        matches it host-side""" },
    { crate = "rayon", wrappers = ["buildl"], reason = """\
        architecture.md §6: rayon is confined to the Digester adapter inside buildl""" },
    { crate = "clap", wrappers = ["buildl-cli"], reason = """\
        ABB §1.2 and §4: the argument surface is the binary's alone""" },
    { crate = "tonic", wrappers = ["buildl", "tonic-prost"], reason = """\
        the gRPC client is the remote adapter's inside buildl; tonic-prost is tonic's own codec \
        crate""" },
    { crate = "prost", wrappers = ["buildl", "prost-types", "tonic-prost"], reason = """\
        the REAPI messages are the remote adapter's inside buildl; prost-types and tonic-prost \
        are prost's and tonic's own companions""" },
    { crate = "uuid", wrappers = ["buildl"], reason = """\
        only the remote adapter names ByteStream upload resources""" },
    { crate = "notify", wrappers = ["buildl"], reason = """\
        only the watch adapter inside buildl names the operating system's file events""" },
]
skip = [
    { crate = "getrandom@0.2.17", reason = """\
        ring, the TLS stack of the gRPC client, is on getrandom 0.2, while tempfile and uuid \
        are on 0.4""" },
    { crate = "syn@2.0.119", reason = """\
        prost-derive, pin-project-internal and tracing-attributes, in the gRPC client's tree, \
        are on syn 2, while serde_derive, thiserror-impl, clap_derive and the tokio macros are \
        on syn 3; a proc-macro dependency, compiled for the build host alone""" },
    { crate = "windows-sys@0.52.0", reason = """\
        ring is on windows-sys 0.52, while the rest of the tree is on 0.61; Windows targets \
        only""" },
]
skip-tree = []

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------

[sources]
# crates.io only. A git or vendored dependency slipping into the lock file is a
# supply-chain change worth failing over.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
