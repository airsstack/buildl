#
# cargo-deny policy for the buildl workspace.
#
#   cargo make deny        # all four checks
#   cargo deny check bans  # one of them
#
# Four independent checks: security advisories, license acceptability, dependency
# bans/duplicates, and source registries. CI runs all four.
#
# Install: cargo install --locked cargo-deny
#

[graph]
# Deliberately no `targets` list. Restricting it would silence findings on
# platforms this workspace has not ruled out, and the whole-graph view costs
# nothing while every license present resolves to something permissive.
all-features = true

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Security advisories — RustSec
# ---------------------------------------------------------------------------

[advisories]
# Everything the database reports is a failure. Suppressions are per-advisory
# and belong here with a note saying why the exposure does not apply, never as
# a blanket severity threshold.
ignore = []

# ---------------------------------------------------------------------------
# Licenses
# ---------------------------------------------------------------------------

[licenses]
# Permissive licenses only, seeded from airsl's graph — the set buildl's planned
# dependency catalog resolves into. Anything arriving outside this set fails the
# check, which is the point: a copyleft dependency should be a decision, not a
# silent transitive addition.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.8
exceptions = []
# The member crates are still empty scaffolds, so most of the allow list is not
# yet exercised by the graph. Without this, every unmatched allowance warns on
# each run until the dependency catalog is actually consumed. Remove once the
# first real dependencies land.
unused-allowed-license = "allow"

[licenses.private]
# Both workspace members are published to crates.io under Apache-2.0, so their
# license text is a distribution question and is checked like any other crate.
ignore = false

# ---------------------------------------------------------------------------
# Bans and duplicate versions
# ---------------------------------------------------------------------------

[bans]
# Duplicates are denied rather than warned so a second copy of a crate has to
# be acknowledged here. The `skip` list below freezes the current state, so a
# *new* duplicate fails even though the known ones pass.
multiple-versions = "deny"
# No `version = "*"` dependencies. The root manifest pins every direct one.
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------

[sources]
# crates.io only. A git or vendored dependency slipping into the lock file is a
# supply-chain change worth failing over.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
