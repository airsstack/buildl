#
# cargo-make task graph for the buildl workspace.
#
#   cargo make            # the full Definition-of-Done gate
#   cargo make fmt        # rewrite formatting (the only task that mutates the tree)
#   cargo make clippy     # a single gate step
#   cargo make book       # serve the book at http://localhost:3000
#   cargo make book-build # build the book once into book/book/
#   cargo make --list-all-steps
#
# The five gate steps are the canonical command set for this repository: fmt, clippy,
# rustdoc, tests, doctests, every one of them warnings-as-errors. CI runs
# `cargo make dod`, so the pipeline and a local run are the same command.
#
# Install: cargo install --locked cargo-make
#

[config]
# Every gate command already carries `--workspace`, so the task must run exactly
# once from the workspace root. Without this, cargo-make re-runs each task once
# per member crate — redundant full-workspace builds.
default_to_workspace = false
# No implicit task graph. The gate is only what is written below, and a
# built-in `build`/`test`/`ci-flow` inherited from cargo-make's core set would
# run cargo commands nobody in this repo chose.
skip_core_tasks = true
min_version = "0.37.0"

[env]
CARGO_TERM_COLOR = "always"

# `--all-features` below builds the one optional feature, `test-server` of `buildl`
# (the server halves of the generated REAPI services), so the gate lints and tests
# the code a default build leaves out.

# ---------------------------------------------------------------------------
# The gate
# ---------------------------------------------------------------------------

[tasks.default]
alias = "dod"

[tasks.dod]
category = "Gate"
description = "Definition of Done — every step must exit 0 with zero warnings"
dependencies = ["fmt-check", "clippy", "doc", "test", "test-doc"]

[tasks.fmt-check]
category = "Gate"
description = "Assert formatting without rewriting anything"
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.clippy]
category = "Gate"
description = "Lint every target, warnings are errors"
# The architecture guards hang here rather than on `dod`: `dod` mirrors the
# rust-guidelines five-command Definition of Done and gains no sixth step (see
# the `deny` task's comment). Hanging them off `clippy` puts both in front of
# anyone about to commit, because `cargo make`, `cargo make dod` and
# `cargo make clippy` all run them.
dependencies = [
  "guard-core-purity",
  "guard-crate-edges",
  "guard-module-edges",
  "guard-adapter-isolation",
]
# `--all-targets` covers tests, examples and benches — a lint living only in
# test code passes silently without it. `-D warnings` also promotes plain rustc
# warnings, which is why the gate has no separate `cargo build` step.
command = "cargo"
args = [
  "clippy",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--",
  "-D",
  "warnings",
]

[tasks.doc]
category = "Gate"
description = "Build rustdoc with warnings promoted to errors"
# Plain `cargo doc` prints rustdoc warnings and still exits 0; RUSTDOCFLAGS is
# the only thing that makes this step a gate rather than a report.
command = "cargo"
args = ["doc", "--workspace", "--all-features", "--no-deps"]

[tasks.doc.env]
RUSTDOCFLAGS = "-D warnings"

[tasks.test]
category = "Gate"
description = "Unit, integration, example and bench targets"
command = "cargo"
args = ["test", "--workspace", "--all-targets", "--all-features"]

[tasks.test-doc]
category = "Gate"
description = "Doctests — excluded by --all-targets, so they need their own run"
command = "cargo"
args = ["test", "--workspace", "--all-features", "--doc"]

# ---------------------------------------------------------------------------
# Supply chain
# ---------------------------------------------------------------------------

[tasks.deny]
category = "Supply chain"
description = "cargo-deny: security advisories, licenses, duplicate versions, sources"
# Deliberately not a dependency of `dod`. The Definition of Done is the five
# commands the guideline skill owns; adding a sixth here would make this file
# disagree with its source of truth. This check also answers to a moving
# advisory database rather than to the working tree, so it can fail on a commit
# that changed nothing.
#
# `-D unused-wrapper` promotes cargo-deny's own warning to an error: a wrapper
# declared for a crate that is not in the graph is a ban list describing a
# dependency graph that no longer exists. The same flag is on the CI step.
command = "cargo"
args = ["deny", "check", "-D", "unused-wrapper"]

# ---------------------------------------------------------------------------
# Architecture guards
# ---------------------------------------------------------------------------

[tasks.guard-crate-edges]
category = "Gate"
description = "Assert every member's direct dependencies against crates/expected-edges.txt"
# cargo-deny states which edges are forbidden; nothing there states which edges
# must exist, and nothing there sees a forbidden dependency on a crate that is
# not in the graph yet. A committed dump of the live graph covers both. Colour is off
# because CARGO_TERM_COLOR is "always" above, which would put colour codes into the dump;
# `(*)` marks a crate cargo has already listed once.
script_runner = "@shell"
script = '''
expected="crates/expected-edges.txt"
actual="$(mktemp)"
trap 'rm -f "${actual}"' EXIT

for member in buildl-core buildl-lua buildl buildl-cli; do
    echo "# ${member}" >> "${actual}"
    cargo tree --color never -p "${member}" --depth 1 --edges normal,dev --prefix none --format '{lib}' \
        | tail -n +2 >> "${actual}"
done

if ! diff -u "${expected}" "${actual}"; then
    echo "guard: crate edges do not match ${expected}" >&2
    echo "       fix the manifest, or update the golden file if the change is intended" >&2
    exit 1
fi
'''

[tasks.guard-module-edges]
category = "Gate"
description = "Assert buildl-core's module-to-module imports against crates/expected-module-edges.txt"
# The compiler lets any module of a crate import any other, so nothing stops one
# pipeline phase from importing another — the rule buildl-core's crate doc states
# first. A committed list of the imports that exist turns a new one into a diff
# someone has to approve.
#
# The listing reads the text `crate::<module>` on lines that are not comments.
# Three spellings cross modules without that text, so each is refused outright: a
# grouped `crate::{...}`; `super::` climbing to the crate root — twice from a
# nested file, once from a module's own mod.rs; and `crate::<Item>`, an item named
# through the crate root's re-export, which hides the module it lives in.
script_runner = "@shell"
script = '''
src="crates/buildl-core/src"
expected="crates/expected-module-edges.txt"
actual="$(mktemp)"
trap 'rm -f "${actual}"' EXIT
export LC_ALL=C

if grep -rnE 'crate::\{|super::super' "${src}"; then
    echo "guard: the imports above cross modules in a spelling the edge listing cannot read" >&2
    echo "       write each one as crate::<module>::<item>" >&2
    exit 1
fi

if grep -n 'super::' "${src}"/*/mod.rs; then
    echo "guard: super:: in a module's mod.rs names the crate root" >&2
    echo "       write each one as crate::<module>::<item>" >&2
    exit 1
fi

if grep -rnE 'crate::[A-Z]' "${src}" | grep -vE '^[^:]*:[0-9]+:[[:space:]]*//'; then
    echo "guard: the lines above name an item through the crate root, which hides its module" >&2
    echo "       write each one as crate::<module>::<item>" >&2
    exit 1
fi

for entry in "${src}"/*; do
    module="$(basename "${entry}" .rs)"
    if [ "${module}" = "lib" ]; then
        continue
    fi
    grep -rhv '^[[:space:]]*//' "${entry}" \
        | grep -oE 'crate::[a-z_]+' \
        | sort -u \
        | sed "s|^crate::|${module} -> |" \
        | grep -v "^${module} -> ${module}$" >> "${actual}" || true
done

if ! diff -u "${expected}" "${actual}"; then
    echo "guard: buildl-core's module edges do not match ${expected}" >&2
    echo "       remove the import, or update the golden file if the edge is intended" >&2
    exit 1
fi
'''

[tasks.guard-adapter-isolation]
category = "Gate"
description = "Assert no adapter module of buildl names another module of the crate"
# The compiler lets any module of a crate import any other, so nothing stops one
# adapter from leaning on another — and adapters that lean on each other can no
# longer be read, tested or replaced alone (book/src/ch11-03-four-crates.md
# dependency rule 2). What several adapters need lives in the two shared modules,
# `state` and `search_path`, which implement no port; adapters meet only in the
# composition modules, `local_ports` and `workspace`.
#
# A rule check with no golden file: the rule is "no edge", so a committed list
# would record nothing but the composition root's own imports.
#
# The listing reads the text `crate::<module>` on lines that are not comments,
# test code included. Three spellings cross modules without that text, so each
# is refused outright: a grouped `crate::{...}`; `super::` climbing to the crate
# root — twice from a nested file, once from a module's own mod.rs or from a
# module that is a single file; and `crate::<Item>`, an item named through the
# crate root, which hides the module it lives in.
script_runner = "@shell"
script = '''
src="crates/buildl/src"
# The modules that wire adapters together, and the modules adapters may share.
composition="local_ports workspace"
support="state search_path"
export LC_ALL=C

if grep -rnE 'crate::\{|super::super' "${src}"; then
    echo "guard: the imports above cross modules in a spelling the edge listing cannot read" >&2
    echo "       write each one as crate::<module>::<item>" >&2
    exit 1
fi

# In a module's mod.rs, and in a module that is one file, super is the crate root.
if grep -n 'super::' "${src}"/*.rs "${src}"/*/mod.rs; then
    echo "guard: super:: in a mod.rs or in a single-file module names the crate root" >&2
    echo "       write crate::<module>::<item>, in that file's tests too" >&2
    exit 1
fi

if grep -rnE 'crate::[A-Z]' "${src}" | grep -vE '^[^:]*:[0-9]+:[[:space:]]*//'; then
    echo "guard: the lines above name an item through the crate root, which hides its module" >&2
    echo "       name a buildl-core item as buildl_core::<item>, and a module's as crate::<module>::<item>" >&2
    exit 1
fi

edges="$(mktemp)"
trap 'rm -f "${edges}"' EXIT
for entry in "${src}"/*; do
    module="$(basename "${entry}" .rs)"
    if [ "${module}" = "lib" ]; then
        continue
    fi
    grep -rhv '^[[:space:]]*//' "${entry}" \
        | grep -oE 'crate::[a-z_]+' \
        | sort -u \
        | sed "s|^crate::|${module} -> |" \
        | grep -v "^${module} -> ${module}$" >> "${edges}" || true
done

status=0
while read -r from arrow to; do
    case " ${composition} " in *" ${from} "*) continue ;; esac
    case " ${support} " in *" ${to} "*)
        case " ${support} " in *" ${from} "*) ;; *) continue ;; esac ;;
    esac
    echo "guard: ${from} ${arrow} ${to}: a module of buildl names a module it may not" >&2
    status=1
done < "${edges}"

if [ "${status}" -ne 0 ]; then
    echo "       an adapter module may name state and search_path and no other module of the crate;" >&2
    echo "       state and search_path name none; adapters meet only in local_ports and workspace" >&2
    echo "       (book/src/ch11-03-four-crates.md dependency rule 2)" >&2
    exit 1
fi
echo "guard-adapter-isolation: OK ($(wc -l < "${edges}" | tr -d ' ') edges)"
'''

[tasks.guard-core-purity]
category = "Gate"
description = "Assert buildl-core names no I/O, process, thread, environment or clock API"
# `cargo make clippy` already fails on a real violation. What it does not fail
# on is a ban entry that stopped resolving: clippy warns and exits 0, so every
# ban could rot away under a green gate. The assertions below cover: config
# presence, ban rot surfaced by clippy's own diagnostics, `allow-invalid`
# silencing a rotted ban, source-level suppression of a `disallowed_*` lint
# (directly or via a blanket group allow), and a crate-local `[lints]`
# override in the manifest.
script_runner = "@shell"
script = '''
config="crates/buildl-core/clippy.toml"
if [ ! -f "${config}" ]; then
    echo "guard: ${config} is missing — every purity ban is gone" >&2
    exit 1
fi

out=$(cargo clippy -p buildl-core --all-targets --all-features -- -D warnings 2>&1) || {
    printf '%s\n' "${out}"
    exit 1
}
printf '%s\n' "${out}"

# Any diagnostic whose span points at the config file means a ban stopped resolving.
if printf '%s\n' "${out}" | grep -qE 'clippy\.toml:[0-9]+'; then
    echo "guard: a ban in crates/buildl-core/clippy.toml no longer resolves" >&2
    exit 1
fi

# clippy.toml's own header comment documents the allow-invalid flag, so a plain
# `grep -q 'allow-invalid' "${config}"` always matches that comment line and can
# never pass. Strip comment lines first, then match the remaining TOML plainly:
# that still catches a live `allow-invalid = true` entry no matter what else is
# on the line (a `#` inside a quoted reason string no longer hides it).
if grep -vE '^[[:space:]]*#' "${config}" | grep -q 'allow-invalid'; then
    echo "guard: allow-invalid disables rot detection for a ban entry" >&2
    exit 1
fi

# Match the lint name alone, with no attribute syntax around it, so no spelling
# of the suppression — `#[allow]`, `#![allow]`, `#[expect]`, `cfg_attr`, or a
# rustfmt-stable multi-line attribute that splits the name onto its own line —
# can evade a line-scoped pattern. `clippy::all` and `clippy::style` are listed
# alongside `disallowed_` because disallowed-methods, disallowed-types and
# disallowed-macros are members of exactly those two groups (per
# `clippy-driver -Whelp`); allowing either group silences all three bans without
# ever naming them.
if grep -rnE --include='*.rs' 'clippy::(disallowed_|all\b|style\b)' crates/buildl-core; then
    echo "guard: a purity ban was suppressed in source" >&2
    echo "       move the call to an adapter behind a port, or delete the ban" >&2
    echo "       and record the decision in book/src/ch11-06-decision-records.md" >&2
    exit 1
fi

# `--include='*.rs'` above never sees the manifest, yet a crate-local
# `[lints.clippy]` override there silences a ban just as effectively as a
# source suppression. buildl-core's lint table is exactly `[lints]` /
# `workspace = true` today; assert it stays that way.
manifest_lints="$(sed -n '/^\[lints/,/^\[/p' crates/buildl-core/Cargo.toml | grep -vE '^\[|^[[:space:]]*$')"
if [ "${manifest_lints}" != "workspace = true" ]; then
    echo "guard: crates/buildl-core/Cargo.toml's [lints] table is not plain \`workspace = true\`" >&2
    echo "       a crate-local lint override can allow a disallowed_* lint" >&2
    exit 1
fi
'''

# ---------------------------------------------------------------------------
# Examples
# ---------------------------------------------------------------------------

[tasks.examples]
category = "Examples"
description = "Run examples/check.sh for every example under examples/ but remote"
# Each example needs its own toolchain beside the buildl binary, so this is not a
# step of `dod`. `remote` is left out: it needs a remote execution server.
script_runner = "@shell"
script = '''
set -e
cargo build -p buildl-cli
BUILDL="${CARGO_TARGET_DIR:-$(pwd)/target}/debug/buildl"
export BUILDL

for example in examples/*/; do
    example="${example%/}"
    [ -f "${example}/assert.sh" ] || continue
    [ "${example}" = "examples/remote" ] && continue
    sh examples/check.sh "${example}"
done
'''

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------

[tasks.plugins]
category = "Plugins"
description = "Run the Lua tests of the plugins under plugins/"
# Not a step of `dod`: it needs airsl, which a Rust gate should not require.
script_runner = "@shell"
script = '''
set -e

if ! command -v airsl >/dev/null 2>&1; then
    echo "plugins: airsl is not on PATH; install it with: cargo install --locked airsl-cli" >&2
    exit 1
fi

T="$(mktemp -d)"
trap 'rm -rf "${T}"' EXIT

# The tests require the modules they test as siblings, so both go in one folder.
for file in plugins/c/*.lua plugins/c/tests/*.lua; do
    [ -f "${file}" ] || continue
    if [ -e "${T}/$(basename "${file}")" ]; then
        echo "plugins: ${file} has the name of another staged file" >&2
        exit 1
    fi
    cp "${file}" "${T}/"
done
(cd "${T}" && airsl test --allow-read . .)
'''

# ---------------------------------------------------------------------------
# Skills
# ---------------------------------------------------------------------------

[tasks.skills]
category = "Skills"
description = "Check the AI skills under skills/: the Agent Skills format, the marketplace paths, the Lua tests, every lua block, the installer"
# Not a step of `dod`: beside the Rust toolchain it needs airsl, Python's
# skills-ref and shellcheck, which a Rust gate should not require.
script_runner = "@shell"
script = '''
set -e
cargo build -p buildl-cli
BUILDL="${CARGO_TARGET_DIR:-$(pwd)/target}/debug/buildl"

if ! command -v airsl >/dev/null 2>&1; then
    echo "skills: airsl is not on PATH; install it with: cargo install --locked airsl-cli" >&2
    exit 1
fi
if ! command -v skills-ref >/dev/null 2>&1; then
    echo "skills: skills-ref is not on PATH; install it with:" >&2
    echo '  pip install "git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"' >&2
    exit 1
fi
if ! command -v shellcheck >/dev/null 2>&1; then
    echo "skills: shellcheck is not on PATH; install it from https://www.shellcheck.net" >&2
    exit 1
fi

T="$(mktemp -d)"
W="$(mktemp -d)"
T2="$(mktemp -d)"
trap 'rm -rf "${T}" "${W}" "${T2}"' EXIT

for skill in skills/*/; do
    [ -f "${skill}SKILL.md" ] || continue
    skills-ref validate "${skill%/}"
done

# `claude plugin validate` does not check the skill paths the marketplace lists.
airsl run --allow-read . skills/tests/marketplace.lua

# The tests read fixtures/ relative to the folder they run from, and require the
# libraries they test as siblings.
cp -R skills/tests/. "${T}/"
for lib in skills/*/scripts/*.lua; do
    [ -f "${lib}" ] || continue
    if [ -e "${T}/$(basename "${lib}")" ]; then
        echo "skills: ${lib} has the name of another staged file" >&2
        exit 1
    fi
    cp "${lib}" "${T}/"
done
(cd "${T}" && airsl test --allow-read . .)

airsl run --allow-read skills --allow-read "${W}" --allow-write "${W}" skills/tests/snippets.lua "${W}"
for dir in "${W}"/*/; do
    [ -d "${dir}" ] || continue
    case "$(basename "${dir}")" in
        tests-fixtures-*)
            echo "skills: a test fixture's lua block was taken as skill content" >&2
            exit 1
            ;;
    esac
    if ! (cd "${dir}" && "${BUILDL}" check); then
        echo "skills: buildl check failed for $(basename "${dir}")" >&2
        exit 1
    fi
done

shellcheck skills/install.sh
DRY="$(sh skills/install.sh --dry-run --dir "${T2}")"
if [ -n "$(ls -A "${T2}")" ]; then
    echo "skills: install.sh --dry-run wrote into ${T2}" >&2
    exit 1
fi
for name in buildl buildl-migrate; do
    if ! printf '%s\n' "${DRY}" | grep -E "^\+ cp -R .*skills/${name} " >/dev/null; then
        echo "skills: install.sh --dry-run prints no copy of skills/${name}" >&2
        exit 1
    fi
done
status=0
sh skills/install.sh >/dev/null 2>&1 || status=$?
if [ "${status}" -ne 2 ]; then
    echo "skills: install.sh with no option exited ${status}, not 2" >&2
    exit 1
fi
'''

[tasks.skills-claude]
category = "Skills"
description = "Check .claude-plugin/marketplace.json and the skills it lists with Claude Code's validator"
# Run by hand before a commit that touches .claude-plugin/ or skills/. It is in
# neither CI nor `dod`: it needs the claude command.
command = "claude"
args = ["plugin", "validate", "--strict", "."]

# ---------------------------------------------------------------------------
# Book
# ---------------------------------------------------------------------------

# `book` and `book-build` install mdBook and mdbook-mermaid on first use rather than failing
# with a missing binary. The versions are exact, not floors: mdbook-mermaid
# 0.17 needs mdBook 0.5, so a floor would install a pair that cannot build the
# book. The same two versions are pinned in ci.yml's `book` job and in
# pages.yml; change all three together. The output lands in `book/book/`,
# which is ignored — the published copy is built by the Pages workflow.
#
# Each install task asks the binary on PATH for its version. cargo-make's
# `install_crate` is not used: it reads the version from cargo's install
# record, so it accepts a binary of another version found first on PATH. When
# that binary is still not the pinned version after installing, the task fails
# and names it rather than build with the wrong one.

[tasks.book-mdbook]
category = "Book"
description = "Install mdBook 0.4.52 unless that version is the one on PATH"
script_runner = "@shell"
script = '''
case "$(mdbook --version 2>/dev/null)" in
    "mdbook v0.4.52") ;;
    *) cargo install mdbook --version 0.4.52 --locked --force ;;
esac
if [ "$(mdbook --version 2>/dev/null)" != "mdbook v0.4.52" ]; then
    echo "mdbook on PATH is $(command -v mdbook), not v0.4.52; put ~/.cargo/bin first" >&2
    exit 1
fi
'''

[tasks.book-mermaid]
category = "Book"
description = "Install mdbook-mermaid 0.16.2, which draws the book's diagrams, unless that version is the one on PATH"
script_runner = "@shell"
script = '''
case "$(mdbook-mermaid --version 2>/dev/null)" in
    "mdbook-mermaid 0.16.2") ;;
    *) cargo install mdbook-mermaid --version 0.16.2 --locked --force ;;
esac
if [ "$(mdbook-mermaid --version 2>/dev/null)" != "mdbook-mermaid 0.16.2" ]; then
    echo "mdbook-mermaid on PATH is $(command -v mdbook-mermaid), not 0.16.2; put ~/.cargo/bin first" >&2
    exit 1
fi
'''

[tasks.book]
category = "Book"
description = "Serve the book at http://localhost:3000, rebuilding on every edit"
dependencies = ["book-mdbook", "book-mermaid"]
command = "mdbook"
args = ["serve", "book", "--open"]

[tasks.book-build]
category = "Book"
description = "Build the book once into book/book/, the same build Pages publishes"
dependencies = ["book-mdbook", "book-mermaid"]
command = "mdbook"
args = ["build", "book"]

# ---------------------------------------------------------------------------
# Development helpers
# ---------------------------------------------------------------------------

[tasks.install]
category = "Development"
description = "Install the buildl binary from this checkout"
command = "cargo"
args = ["install", "--path", "crates/buildl-cli", "--locked", "--force"]

[tasks.fmt]
category = "Development"
description = "Rewrite formatting in place"
command = "cargo"
args = ["fmt", "--all"]

[tasks.clippy-fix]
category = "Development"
description = "Apply the clippy suggestions that are machine-applicable"
command = "cargo"
args = [
  "clippy",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--fix",
  "--allow-dirty",
]

[tasks.dod-crate]
category = "Development"
description = "The gate scoped to one crate: cargo make dod-crate buildl"
# While developing a single-crate change, `-p <crate>` replaces `--workspace`.
# Cross-crate changes and pre-release runs use the unscoped `dod`.
script_runner = "@shell"
script = '''
crate="${1}"
if [ -z "${crate}" ]; then
    echo "usage: cargo make dod-crate <crate-name>" >&2
    exit 1
fi
set -x
cargo fmt -p "${crate}" -- --check
cargo clippy -p "${crate}" --all-targets --all-features -- -D warnings
RUSTDOCFLAGS="-D warnings" cargo doc -p "${crate}" --all-features --no-deps
cargo test -p "${crate}" --all-targets --all-features
cargo test -p "${crate}" --all-features --doc
'''

[tasks.reapi-codegen]
category = "Development"
description = "Regenerate crates/buildl/generated/reapi/ from the vendored protos"
# The generator is a package of its own, excluded from the workspace, so its
# build tools (protox, prost-build) never enter the workspace's dependency graph.
# `--locked` resolves the generator exactly as its committed lock file says.
command = "cargo"
args = [
  "run",
  "--locked",
  "--manifest-path",
  "tools/reapi-codegen/Cargo.toml",
]
