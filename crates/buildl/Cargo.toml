[package]
name         = "buildl"
version      = "0.1.0"
description  = "A sandboxed, deterministic build system whose build files are written in Lua and evaluated on the airsl embedded runtime."
readme       = "README.md"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
# The pipeline, its ports, and the domain values this crate's adapters serve.
buildl-core = { workspace = true }
# The Lua build-file adapter, bound to the pipeline here alongside the others.
buildl-lua  = { workspace = true }
# The generated gRPC services of the remote cache, and what they call.
prost       = { workspace = true }
prost-types = { workspace = true }
tonic       = { workspace = true }
tonic-prost = { workspace = true }
# The runtime the remote adapter owns for its gRPC client.
tokio       = { workspace = true }
# Names of ByteStream uploads.
uuid        = { workspace = true }
# Hashing many input files at once. Named by the `Digester` adapter and by no
# other module, so the executor's plain threads stay the crate's one threading model.
rayon       = { workspace = true }
# Derives for what this crate reads and writes in a shape of its own: the tables
# of `buildl.toml`, a line of the cache journal and an entry of the stat cache.
serde       = { workspace = true }
# Temp-file-then-rename in the shared `state` module, and the temp workspaces of
# this crate's tests.
tempfile    = { workspace = true }
# The error of taking the state-directory lock.
thiserror   = { workspace = true }
# Parsing `buildl.toml` in the `Manifest` adapter.
toml        = { workspace = true }
# Where a table of `buildl.toml` is first written, for the refusals of a table as a whole.
toml_edit   = { workspace = true }

[features]
# The server halves of the generated REAPI services and what serves them, for the
# in-test remote cache of buildl's and buildl-cli's tests; never in the shipped binary.
# `router` because the test server serves several services on one address, which tonic
# offers only through its `Router`.
test-server = ["tonic/server", "tonic/router", "tokio/net"]

[lints]
workspace = true
