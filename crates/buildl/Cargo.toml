[package]
name         = "buildl"
version      = "0.1.0"
description  = "A sandboxed, deterministic build system whose build files are written in Lua and evaluated on the airsl embedded runtime."
readme       = "README.md"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
# The pipeline, its ports, and the domain values this crate's adapters serve.
buildl-core = { workspace = true }
# The Lua build-file adapter, bound to the pipeline here alongside the others.
buildl-lua  = { workspace = true }

[lints]
workspace = true
