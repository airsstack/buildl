#
# Purity bans for buildl-core.
#
# architecture-building-blocks.md §1.2: this crate may use `std`, excluding its
# I/O, process, thread, environment and clock APIs. The crate boundary does not
# enforce that — `std` is in scope for every crate — so the rule is enumerated
# here and asserted by `cargo make guard-core-purity`.
#
# A crate-local clippy.toml SHADOWS a workspace-root one rather than merging
# with it. There is no root clippy.toml today; if one is ever added, this crate
# will not see it.
#
# `cargo make guard-core-purity` rejects, in source, any spelling of an attribute
# naming a `disallowed_*` lint or a blanket `clippy::all`/`clippy::style` allow
# that would silence one, `allow-invalid = true` on a ban entry, and a
# crate-local `[lints]` override in this crate's Cargo.toml. The documented path
# for a legitimate need is to move the call into an adapter behind a port, or —
# failing that — to delete the entry, amend §1.2 and add a decision record to
# architecture.md §6.
#
# Derivation and per-family counts: docs/architecture-building-blocks.md §1.2.
#
