[package]
name         = "buildl-core"
version      = "0.1.0"
description  = "Domain data, ports, and pure pipeline logic for the buildl build system — no I/O, no Lua."
readme       = "README.md"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

# No buildl crate, no airsl, no I/O library — ever. These four pure-computation
# crates from the workspace catalog are the complete set this crate may take, and
# all four are declared up front: the crate-edge guard diffs this table against
# crates/expected-edges.txt, so adding them one at a time would serialize work
# that is otherwise independent. An edge with no user yet is expected, not dead.
[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
sha2       = { workspace = true }
thiserror  = { workspace = true }

[lints]
workspace = true
