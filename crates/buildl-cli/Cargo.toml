[package]
name         = "buildl-cli"
version      = "0.1.0"
description  = "The `buildl` binary — the command-line entry point to the buildl library."
readme       = "README.md"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[[bin]]
name = "buildl"
path = "src/main.rs"
# The binary shares its name with the library; without this, `cargo doc` collides
# on target/doc/buildl (cargo #6313). The bin has no public API to document.
doc  = false

[dependencies]
# The binary's only library dependency. All build logic lives in the library
# crates, and core types reach the binary through `buildl`, never directly.
buildl = { workspace = true }
# The argument surface: the commands, their flags, `--help` and the usage errors.
clap   = { workspace = true }

[dev-dependencies]
# The in-memory remote cache the binary tests run against; `test-server` is a feature the
# library offers to its tests alone.
buildl   = { workspace = true, features = ["test-server"] }
# The temporary workspaces the tests run the commands in.
tempfile = { workspace = true }

[lints]
workspace = true
