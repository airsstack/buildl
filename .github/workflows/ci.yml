name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same ref supersedes whatever is still running for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are dead weight in a fresh runner and only bloat the cache.
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1

jobs:
  dod:
    name: Definition of Done
    # The matrix mirrors airsl's: once `airsl` lands in the dependency graph it
    # compiles vendored Lua 5.4 from C, and the exec/store modules touch paths,
    # processes and filesystems in platform-specific ways. A break there is
    # invisible on a single runner, so the matrix is in place from day one.
    #
    # Unix only, deliberately — matching airsl, which refuses to build off unix.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # `rustup toolchain install` with no argument installs the toolchain
      # rust-toolchain.toml names, or updates it when the runner image carries an
      # older stable. The versions printed below are the record of which toolchain
      # the gate ran on.
      - name: Install the latest stable Rust toolchain
        run: |
          rustup toolchain install
          rustup show
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate-${{ matrix.os }}

      - name: Install cargo-make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make

      # One command, the same one a developer runs locally: fmt-check, clippy,
      # rustdoc, tests, doctests — each with warnings as errors.
      - name: cargo make dod
        run: cargo make dod

  deny:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Independent of the gate: this reads Cargo.lock and the advisory database,
    # compiles nothing, and finishes in seconds, so it should not wait behind a
    # build to report a licence or advisory problem.
    steps:
      - uses: actions/checkout@v5

      # cargo-deny shells out to `cargo metadata`, and `cargo` here is a rustup
      # shim that resolves rust-toolchain.toml, so the toolchain it names is
      # needed either way. Installing it in its own step keeps that cost out of
      # the check's log.
      - name: Install the latest stable Rust toolchain
        run: rustup toolchain install

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # Advisories, licences, duplicate versions and source registries. Policy
      # and every suppression live in deny.toml.
      - name: cargo deny check
        run: cargo deny check
