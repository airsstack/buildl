name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same ref supersedes whatever is still running for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are dead weight in a fresh runner and only bloat the cache.
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1

jobs:
  dod:
    name: Definition of Done
    # The matrix mirrors airsl's: `airsl` compiles vendored Lua 5.4 from C, and
    # the execution and storage adapters touch paths, processes and filesystems
    # in platform-specific ways. A break there is invisible on a single runner.
    #
    # Unix only, deliberately — matching airsl, which refuses to build off unix.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # `rustup toolchain install` with no argument installs the toolchain
      # rust-toolchain.toml names, or updates it when the runner image carries an
      # older stable. The versions printed below are the record of which toolchain
      # the gate ran on.
      - name: Install the latest stable Rust toolchain
        run: |
          rustup toolchain install
          rustup show
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate-${{ matrix.os }}

      - name: Install cargo-make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make

      # One command, the same one a developer runs locally: fmt-check, clippy,
      # rustdoc, tests, doctests — each with warnings as errors.
      - name: cargo make dod
        run: cargo make dod

  examples:
    name: Examples
    # Each example under examples/ is a workspace of its own, built and tested by
    # the buildl binary with its language's toolchain. `remote` is left out: it needs
    # a remote execution server.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install the latest stable Rust toolchain
        run: |
          rustup toolchain install
          rustup show
          cargo --version

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: examples-${{ matrix.os }}

      - name: Install cargo-make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make

      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/go/go.mod

      # check.sh reads `plan --json` with python3, and the Python example builds with it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: cargo make examples
        run: cargo make examples

  deny:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Independent of the gate: this reads Cargo.lock and the advisory database,
    # compiles nothing, and finishes in seconds, so it should not wait behind a
    # build to report a licence or advisory problem.
    steps:
      - uses: actions/checkout@v5

      # cargo-deny shells out to `cargo metadata`, and `cargo` here is a rustup
      # shim that resolves rust-toolchain.toml, so the toolchain it names is
      # needed either way. Installing it in its own step keeps that cost out of
      # the check's log.
      - name: Install the latest stable Rust toolchain
        run: rustup toolchain install

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # Advisories, licences, duplicate versions and source registries. Policy
      # and every suppression live in deny.toml. `-D unused-wrapper` must match
      # Makefile.toml's `deny` task — CI invokes the binary directly rather than
      # through cargo-make, so the promotion has to be written in both places.
      - name: cargo deny check
        run: cargo deny check -D unused-wrapper

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `rust-version` in the workspace manifest is a promise to downstream
    # crates, and nothing else in CI compiles on it — the `dod` matrix runs on
    # stable. This job is the only thing that makes the declared floor true.
    #
    # Deliberately CI-only, with no cargo-make task: running it locally means
    # installing a second toolchain, which no contributor should be required to
    # do. Anyone who does have it can run the last step's command directly.
    steps:
      - uses: actions/checkout@v5

      # The manifest stays the single source of truth for the floor. Hard-coding
      # the version here would create a second place to update and a silent
      # disagreement the day only one of them moves.
      - name: Resolve the declared rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Install the declared toolchain
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv

      # `check`, not the full gate: MSRV is a compilation question. `--all-targets`
      # extends it to test and example code, where a post-floor API is just as
      # likely to appear. `+<version>` overrides rust-toolchain.toml's `stable` pin.
      - name: cargo check on the declared floor
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-targets --all-features

  reapi-codegen:
    name: Generated REAPI code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `crates/buildl/generated/reapi/` is committed, not built, so nothing in the
    # gate notices it drifting from the vendored protos or from the generator. This
    # job regenerates it and fails on any difference, then checks the files still
    # ship in the published crate, without which `buildl` would not compile from
    # crates.io.
    steps:
      - uses: actions/checkout@v5

      - name: Install the latest stable Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: reapi-codegen
          workspaces: |
            .
            tools/reapi-codegen

      - name: Install cargo-make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make

      - name: Regenerate the REAPI code
        run: cargo make reapi-codegen

      - name: The committed code matches the generator
        run: git diff --exit-code crates/buildl/generated

      - name: The generated code is in the published crate
        run: |
          cargo package -p buildl --list --allow-dirty > package-files.txt
          grep -q '^generated/reapi/' package-files.txt || {
            echo "generated/reapi/ is missing from the buildl package" >&2
            exit 1
          }

  remote-execution:
    name: Remote execution on NativeLink
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The in-memory test server the gate uses is buildl's own reading of the
    # Remote Execution API; this job runs the binary against a real server.
    # NativeLink's prebuilt image is x86_64 only and its worker matches the
    # runner's OSFamily and ISA, so the job is Linux only. Its published image
    # holds no shell, so ci/nativelink.Dockerfile puts its static binary on a
    # Debian base whose sh and coreutils the actions run.
    steps:
      - uses: actions/checkout@v5

      - name: Install the latest stable Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: remote-execution

      - name: Start NativeLink
        run: |
          docker build -f ci/nativelink.Dockerfile -t buildl-ci-nativelink ci
          docker run -d --name nativelink -p 50051:50051 \
            -v "$PWD/ci/nativelink.json5:/config" buildl-ci-nativelink /config

      # Docker's port proxy accepts a connection on the host as soon as the
      # container starts, so a connect proves nothing. NativeLink logs this line
      # once its local worker has joined the scheduler and a job can run.
      - name: Wait for NativeLink's worker
        run: |
          for _ in $(seq 60); do
            if docker logs nativelink 2>&1 | grep -q 'Worker registered with scheduler'; then exit 0; fi
            sleep 1
          done
          echo "NativeLink's worker did not register within 60 s" >&2
          docker logs nativelink
          exit 1

      - name: The real-server tests
        env:
          BUILDL_TEST_REAPI_URL: grpc://127.0.0.1:50051
        # Each server test prints one `real server:` line when it runs; three such
        # lines prove none of them skipped.
        run: |
          cargo test -p buildl-cli --test real_remote -- --nocapture 2>&1 | tee real_remote.log
          test "${PIPESTATUS[0]}" -eq 0
          ran=$(grep -c '^real server: ' real_remote.log || true)
          test "$ran" -eq 3 || { echo "expected 3 server tests to run, $ran did" >&2; exit 1; }

      - name: NativeLink's log
        if: failure()
        run: docker logs nativelink

  examples-remote:
    name: Remote example on NativeLink
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # examples/remote runs on a NativeLink server it starts itself with docker
    # compose. Linux only, for the reason the remote-execution job gives.
    steps:
      - uses: actions/checkout@v5

      - name: Install the latest stable Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: examples-remote

      # The copies that build locally run python3, and so does assert.sh.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build buildl
        run: cargo build -p buildl-cli

      - name: Start the example's server
        run: docker compose -f examples/remote/compose.yaml up -d --build

      - name: Wait for NativeLink's worker
        run: |
          for _ in $(seq 60); do
            if docker compose -f examples/remote/compose.yaml logs nativelink 2>&1 | grep -q 'Worker registered with scheduler'; then exit 0; fi
            sleep 1
          done
          echo "NativeLink's worker did not register within 60 s" >&2
          docker compose -f examples/remote/compose.yaml logs nativelink
          exit 1

      - name: The four copies
        env:
          BUILDL: target/debug/buildl
        run: sh examples/remote/assert.sh

      - name: NativeLink's log
        if: failure()
        run: docker compose -f examples/remote/compose.yaml logs nativelink
